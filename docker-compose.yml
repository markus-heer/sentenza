name: sentenza

services:
  postgres:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentenza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentenza}
      POSTGRES_DB: ${POSTGRES_DB:-sentenza}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sentenza} -d ${POSTGRES_DB:-sentenza}']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  postgres-test:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-sentenza}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-sentenza}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-sentenza_test}
    ports:
      - '5433:5432'
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${TEST_POSTGRES_USER:-sentenza} -d ${TEST_POSTGRES_DB:-sentenza_test}',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
  postgres-test-data:
